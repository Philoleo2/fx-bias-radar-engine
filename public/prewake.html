<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>PREWAKE — FX Bias Radar</title>
<link rel="stylesheet" href="/styles.css" />
<style>
  .pw-wrap { max-width: 720px; margin: 0 auto; padding: 12px; }
  .pw-card { border: 1px solid var(--border, #2a2f3a); border-radius: 10px; padding: 12px 14px;
             margin: 10px 0; background: var(--card, #151922); }
  .pw-pair { font-size: 1.35rem; font-weight: 700; letter-spacing: .02em; }
  .pw-dir { font-size: 1rem; font-weight: 600; margin-top: 2px; }
  .pw-long { color: #4ec9a5; } .pw-short { color: #e2757a; }
  .pw-meta { font-size: .9rem; opacity: .82; margin-top: 8px; line-height: 1.5; }
  .pw-badge { display: inline-block; font-size: .72rem; font-weight: 700; letter-spacing: .06em;
              padding: 2px 7px; border-radius: 999px; border: 1px solid currentColor; margin-right: 6px; }
  .pw-badge.dual { color: #7fb3ff; } .pw-badge.backfill { color: #b9a04a; }
  .pw-badge.samebar { color: #c78ad6; }
  .pw-filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .pw-filters select, .pw-filters input { flex: 1 1 40%; min-width: 120px; padding: 7px;
              border-radius: 8px; border: 1px solid var(--border, #2a2f3a);
              background: var(--card, #151922); color: inherit; font-size: .9rem; }
  .pw-status { font-size: .8rem; opacity: .72; line-height: 1.6; margin-top: 18px;
               border-top: 1px solid var(--border, #2a2f3a); padding-top: 12px; }
  .pw-status code { font-size: .78rem; word-break: break-all; }
  .pw-empty { opacity: .65; padding: 24px 4px; text-align: center; }
  .pw-note { font-size: .82rem; opacity: .7; margin-top: 4px; }
  .pw-auth { display: flex; gap: 6px; margin-bottom: 10px; }
  .pw-auth input { flex: 1; padding: 8px; border-radius: 8px;
                   border: 1px solid var(--border, #2a2f3a); background: var(--card, #151922); color: inherit; }
  .pw-auth button { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border, #2a2f3a);
                    background: #222836; color: inherit; }
  .pw-nav { display: flex; margin: 14px 0 10px; }
  .pw-nav a { display: inline-flex; align-items: center; min-height: 38px; padding: 0 12px;
              border: 1px solid var(--border, #2a2f3a); border-radius: 8px;
              background: #222836; color: inherit; font-size: .88rem; font-weight: 700;
              text-decoration: none; }
  .pw-nav a:hover, .pw-nav a:focus-visible { border-color: var(--blue, #6aa7ff); outline: none; }
</style>
</head>
<body>
<div class="pw-wrap">
  <h1 style="font-size:1.1rem;letter-spacing:.08em;margin:6px 0 2px">PREWAKE</h1>
  <div class="pw-note">Radar di attenzione precoce. Non è un consiglio di trade: apri il grafico e verifica a mano.</div>

  <nav class="pw-nav" aria-label="Navigazione PREWAKE">
    <a href="/prewake_history.html">Chiamate ultimi 20 giorni</a>
  </nav>

  <div class="pw-auth" id="authRow">
    <input id="tokenInput" type="password" placeholder="dashboard token" autocomplete="off" />
    <button id="saveToken" type="button">Salva</button>
  </div>

  <div class="pw-filters">
    <input id="fDate" type="date" />
    <select id="fPair"><option value="">tutte le coppie</option></select>
    <select id="fDir"><option value="">entrambe</option><option value="LONG">LONG</option><option value="SHORT">SHORT</option></select>
    <select id="fType"><option value="">tutti gli eventi</option></select>
    <select id="fSample"><option value="">prospective + backfill</option><option value="prospective">solo prospective</option><option value="backfill">solo backfill</option></select>
    <select id="fFx"><option value="">FX Bias dopo: tutti</option><option value="yes">sì</option><option value="no">no</option></select>
  </div>

  <div id="list"></div>
  <div class="pw-status" id="status"></div>
</div>
<script src="/prewake.js"></script>
</body>
</html>
