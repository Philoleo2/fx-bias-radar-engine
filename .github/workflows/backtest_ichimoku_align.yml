# Ichimoku D1+W vs Compressione D1+W for H1 breakouts (research-only).
name: backtest-ichimoku-align
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check OANDA secret
        env:
          OANDA_ACCESS_TOKEN: ${{ secrets.OANDA_ACCESS_TOKEN }}
        run: |
          if [ -z "$OANDA_ACCESS_TOKEN" ]; then
            echo "OANDA_ACCESS_TOKEN secret is missing or empty"; exit 1
          fi
      - name: Ichimoku vs compression alignment backtest
        env:
          OANDA_ACCESS_TOKEN: ${{ secrets.OANDA_ACCESS_TOKEN }}
          OANDA_ENV: practice
        run: python scripts/backtest_ichimoku_align.py --oanda --h1-count 20000 --d-count 1500 --w-count 800 --out reports/ichimoku_align
      - name: Commit report
        run: |
          git config user.name "fx-bias-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f reports/ichimoku_align/ichimoku_align.md reports/ichimoku_align/ichimoku_align.json
          git diff --cached --quiet || git commit -m "Ichimoku alignment report [skip ci]"
          git push
