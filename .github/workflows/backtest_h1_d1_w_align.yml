# Confluenza H1+D1+W: rottura H1 allineata a daily e weekly (on-demand).
name: backtest-h1-d1-w-align
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check OANDA secret
        env:
          OANDA_ACCESS_TOKEN: ${{ secrets.OANDA_ACCESS_TOKEN }}
        run: |
          if [ -z "$OANDA_ACCESS_TOKEN" ]; then
            echo "OANDA_ACCESS_TOKEN secret is missing or empty"; exit 1
          fi
      - name: H1+D1+W alignment backtest
        env:
          OANDA_ACCESS_TOKEN: ${{ secrets.OANDA_ACCESS_TOKEN }}
          OANDA_ENV: practice
        run: python scripts/backtest_h1_d1_w_align.py --oanda --h1-count 20000 --d1-count 1500 --w-count 800 --out reports/h1d1w
      - name: Commit report
        run: |
          git config user.name "fx-bias-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f reports/h1d1w/h1_d1_w_align.md reports/h1d1w/h1_d1_w_align.json
          git diff --cached --quiet || git commit -m "H1+D1+W alignment report [skip ci]"
          git push
