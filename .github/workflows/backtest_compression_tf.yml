# Compressione su H4 e D1, storia lunga walk-forward (on-demand).
name: backtest-compression-tf
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check OANDA secret
        env:
          OANDA_ACCESS_TOKEN: ${{ secrets.OANDA_ACCESS_TOKEN }}
        run: |
          if [ -z "$OANDA_ACCESS_TOKEN" ]; then
            echo "OANDA_ACCESS_TOKEN secret is missing or empty"; exit 1
          fi
      - name: Compression H4 (long walk-forward)
        env:
          OANDA_ACCESS_TOKEN: ${{ secrets.OANDA_ACCESS_TOKEN }}
          OANDA_ENV: practice
        run: python scripts/backtest_compression_tf.py --oanda --granularity H4 --count 20000 --train-bars 6000 --test-bars 2000 --out reports/comp_h4
      - name: Compression D1 (long walk-forward)
        env:
          OANDA_ACCESS_TOKEN: ${{ secrets.OANDA_ACCESS_TOKEN }}
          OANDA_ENV: practice
        run: python scripts/backtest_compression_tf.py --oanda --granularity D --count 4000 --train-bars 1500 --test-bars 500 --out reports/comp_d1
      - name: Commit reports
        run: |
          git config user.name "fx-bias-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f reports/comp_h4/compression_tf.md reports/comp_h4/compression_tf.json reports/comp_d1/compression_tf.md reports/comp_d1/compression_tf.json
          git diff --cached --quiet || git commit -m "Compression H4/D1 reports [skip ci]"
          git push
