# Backtest compressione multi-timeframe: H4+D+W e H1+H4+D vs baseline H1+D+W.
name: backtest-compression-align
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check OANDA secret
        env:
          OANDA_ACCESS_TOKEN: ${{ secrets.OANDA_ACCESS_TOKEN }}
        run: |
          if [ -z "$OANDA_ACCESS_TOKEN" ]; then
            echo "OANDA_ACCESS_TOKEN secret is missing or empty"; exit 1
          fi
      - name: Compression alignment backtest
        env:
          OANDA_ACCESS_TOKEN: ${{ secrets.OANDA_ACCESS_TOKEN }}
          OANDA_ENV: practice
        run: python scripts/backtest_compression_align.py --oanda --h1-count 20000 --h4-count 5000 --d1-count 1500 --w-count 800 --out reports/compression_align
      - name: Commit report
        run: |
          git config user.name "fx-bias-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f reports/compression_align/compression_align.md reports/compression_align/compression_align.json
          git diff --cached --quiet || git commit -m "Compression alignment reports [skip ci]"
          git push
