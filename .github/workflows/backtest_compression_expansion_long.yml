# Compressione + espansione H1 su storico lungo (on-demand, ricerca).
name: backtest-compression-expansion-long

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check OANDA secret
        env:
          OANDA_ACCESS_TOKEN: ${{ secrets.OANDA_ACCESS_TOKEN }}
        run: |
          if [ -z "$OANDA_ACCESS_TOKEN" ]; then
            echo "OANDA_ACCESS_TOKEN secret is missing or empty"; exit 1
          fi
      - name: Run long compression+expansion backtest (H1)
        env:
          OANDA_ACCESS_TOKEN: ${{ secrets.OANDA_ACCESS_TOKEN }}
          OANDA_ENV: practice
        run: python scripts/backtest_compression_expansion_long.py --oanda --count 30000 --page-size 5000 --max-workers 8 --out reports/compexp_long
      - name: Commit report
        run: |
          git config user.name "fx-bias-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f reports/compexp_long/compression_expansion_long.md reports/compexp_long/compression_expansion_long.json
          git diff --cached --quiet || git commit -m "Compression expansion long report [skip ci]"
          git push
