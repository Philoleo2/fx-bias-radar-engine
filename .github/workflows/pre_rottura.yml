# Pre-Rottura (M3) - scan ORARIO H4 direzione + H1 timing.
# Lo schedule e' ATTIVO (richiesta di Leonardo: refresh ogni ora anche se non
# collegato). Al commit/push di questo file il cron parte. Richiede il secret
# OANDA_ACCESS_TOKEN (gia' presente). HH:05 = 5 min dopo la chiusura H1 (no-repaint).
name: pre-rottura-h1

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check OANDA secret
        env:
          OANDA_ACCESS_TOKEN: ${{ secrets.OANDA_ACCESS_TOKEN }}
        run: |
          if [ -z "$OANDA_ACCESS_TOKEN" ]; then
            echo "OANDA_ACCESS_TOKEN secret is missing or empty"
            exit 1
          fi
      - name: Run Pre-Rottura scan
        env:
          OANDA_ACCESS_TOKEN: ${{ secrets.OANDA_ACCESS_TOKEN }}
          OANDA_ENV: practice
        run: python scripts/run_pre_rottura.py --oanda --out reports/prerottura
      - name: Commit result
        run: |
          git config user.name "fx-bias-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f reports/prerottura/pre_rottura_latest.json
          git diff --cached --quiet || git commit -m "Pre-Rottura H1 scan [skip ci]"
          git push
