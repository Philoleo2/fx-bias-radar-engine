# Compressione + espansione H1 (on-demand, ricerca).
name: backtest-compression-expansion

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check OANDA secret
        env:
          OANDA_ACCESS_TOKEN: ${{ secrets.OANDA_ACCESS_TOKEN }}
        run: |
          if [ -z "$OANDA_ACCESS_TOKEN" ]; then
            echo "OANDA_ACCESS_TOKEN secret is missing or empty"; exit 1
          fi
      - name: Run compression+expansion backtest (H1)
        env:
          OANDA_ACCESS_TOKEN: ${{ secrets.OANDA_ACCESS_TOKEN }}
          OANDA_ENV: practice
        run: python scripts/backtest_compression_expansion.py --oanda --count 4000 --out reports/compexp
      - name: Commit report
        run: |
          git config user.name "fx-bias-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f reports/compexp/compression_expansion_edge.md reports/compexp/compression_expansion_edge.json
          git diff --cached --quiet || git commit -m "Compression expansion edge report [skip ci]"
          git push
